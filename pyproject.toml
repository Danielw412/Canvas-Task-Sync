[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-task-sync"
version = "0.1.0"
description = "Extract school assignments from visual agendas and sync them to Google Tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.0,<1",
  "google-api-python-client>=2.198.0,<3",
  "google-auth>=2.56.0,<3",
  "google-auth-oauthlib>=1.4.0,<2",
  "google-genai>=1.0.0,<2",
  "pydantic>=2.11.0,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1.0,<2",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.0,<3",
  "ruamel.yaml>=0.18.10,<0.19",
  "tzdata>=2025.2",
  "uvicorn>=0.35.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10",
  "pytest-cov>=6.0.0,<8",
  "ruff>=0.12.0,<1",
]

[project.scripts]
canvas-task-sync = "canvas_task_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
canvas_task_sync = ["web_dist/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires live Google and Gemini credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
